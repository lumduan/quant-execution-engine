# Container config for the bundled liberator-trading-api overlay.
# Session monitor ships DISABLED (auto_connect: false) until Phase 5.
# Liveness probe is now GET /api/v1/profile (read-only, auth-token-only — Phase 1);
# the former test_payload block (placeholder accountNo/pin for the order pre-place
# probe) is gone — the probe is self-contained and needs no account number or PIN.
session_status:
  monitoring:
    enabled: true
    interval_seconds: 300
    auto_reconnect: true
    max_retries: 3
    retry_delay: 10
  health_check:
    timeout_seconds: 30
    include_runtime: true
    include_config: false
session_monitor:
  auto_connect: false
  checking_time_interval: 300
  enabled: false
  max_retries: 3
  retry_backoff_seconds: 60
  notify_on_reconnect: true
  max_consecutive_failures: 5
  service_pause_minutes: 30
  health_check_on_startup: false
  log_level: info
