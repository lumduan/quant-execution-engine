# Container config for the bundled liberator-trading-api overlay (mounted read-only
# at /app/config/session_status.yaml). Two services read this file:
#   - SessionStatusService   -> session_status.config + session_status.health
#   - SessionMonitorService  -> session_monitor   (auto-relogin; ships DISABLED)
#
# Session monitor ships DISABLED (enabled: false / auto_connect: false) until Phase 5.
# Liveness probe is the read-only GET /api/v1/profile (auth-token-only — Phase 1); it
# needs no account number, PIN, or order-shaped test payload.
#
# Phase 2 consolidated this onto the single consumed schema — the dead
# session_status.monitoring / health_check blocks (read by no service) were removed.
session_status:
  # Liveness-probe HTTP client tuning (SessionStatusConfig).
  config:
    connect_timeout: 10
    request_timeout: 30
    track_session_start: true
    session_timeout_hours: 24
    validate_success_field: true
    log_response_details: false
  # /session/health reporting toggles (SessionStatusHealthConfig).
  health:
    enabled: true
    check_redis_connection: true
    check_auth_token: true
    include_session_runtime: true
# Automated session monitor + auto-reconnect (SessionMonitorConfig) — DISABLED until Phase 5.
session_monitor:
  enabled: false
  auto_connect: false
  checking_time_interval: 300
  max_retries: 3
  retry_backoff_seconds: 60
  retry_backoff_max_seconds: 300
  notify_on_reconnect: true
  max_consecutive_failures: 5
  service_pause_minutes: 30
  health_check_on_startup: false
  log_level: info
