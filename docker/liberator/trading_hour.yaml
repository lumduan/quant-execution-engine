# Trading Hours Configuration (Sample)
# Copy this file to trading_hour.yaml and customize as needed

# Timezone for trading hours (Asia/Bangkok for Thai market)
timezone_name: Asia/Bangkok

# Market holidays (dates when market is closed)
market_holidays:
  - "2025-01-01"  # New Year's Day
  - "2025-12-25"  # Christmas Day
  # Add more holidays as needed

# Trading days configuration
trading_days:
  monday:
    day: monday
    enabled: true
    sessions:
      - session_type: session_i
        start_time: "09:00"
        end_time: "12:30"
        break_start: null
        break_end: null
      - session_type: session_ii
        start_time: "14:30"
        end_time: "17:00"
        break_start: null
        break_end: null

  tuesday:
    day: tuesday
    enabled: true
    sessions:
      - session_type: session_i
        start_time: "09:00"
        end_time: "12:30"
        break_start: null
        break_end: null
      - session_type: session_ii
        start_time: "14:30"
        end_time: "17:00"
        break_start: null
        break_end: null

  wednesday:
    day: wednesday
    enabled: true
    sessions:
      - session_type: session_i
        start_time: "09:00"
        end_time: "12:30"
        break_start: null
        break_end: null
      - session_type: session_ii
        start_time: "14:30"
        end_time: "17:00"
        break_start: null
        break_end: null

  thursday:
    day: thursday
    enabled: true
    sessions:
      - session_type: session_i
        start_time: "09:00"
        end_time: "12:30"
        break_start: null
        break_end: null
      - session_type: session_ii
        start_time: "14:30"
        end_time: "17:00"
        break_start: null
        break_end: null

  friday:
    day: friday
    enabled: true
    sessions:
      - session_type: session_i
        start_time: "09:00"
        end_time: "12:30"
        break_start: null
        break_end: null
      - session_type: session_ii
        start_time: "14:30"
        end_time: "17:00"
        break_start: null
        break_end: null

  saturday:
    day: saturday
    enabled: false
    sessions: []

  sunday:
    day: sunday
    enabled: false
    sessions: []

# Trading status settings
trading_status:
  auto_update: true           # Automatically update trading status
  cache_duration: 300         # Cache duration in seconds (5 minutes)

# Redis integration settings
redis_integration:
  enabled: true               # Enable Redis integration for status sharing
  status_key: "liberator:trading:status"  # Redis key for trading status
  update_interval: 60         # Update interval in seconds
