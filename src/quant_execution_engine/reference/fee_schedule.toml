    `amount` == 0 when matched == 0                          [OBSERVED]  same 3 rows
    `amount` == price x qty when matched == entered          [OBSERVED]  2 full fills
    `amount` == price x MATCHED qty when 0 < matched < ent.   [INFERRED]  no observation exists
    the 0.007 % ratio survives a partial fill                 [INFERRED]  depends on the row above

🔑 WHAT WE HAVE IS TWO ENDPOINTS, NOT A CURVE. `matched == 0 -> amount == 0` and
`matched == entered -> amount == price x qty`. "price x MATCHED qty" is the natural line through
them, and A LINE THROUGH TWO POINTS IS NOT A MEASUREMENT OF THE POINTS BETWEEN.

The full-fill endpoint is confirmed INDEPENDENTLY of the blotter, from `execution.orders`/`fills`:
