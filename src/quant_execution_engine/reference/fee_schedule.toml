  verbatim     = "ไม่เกิน 1,000,000 | 0.0499%"
  corroborated = true
  note = """
PINNED AT THE FIRST (MOST EXPENSIVE) TIER, by this file's policy. Liberator Announcement
016/2568, announced 2025-09-01, effective 2025-10-01 "until changed", internet channel (the
marketing-officer channel is billed at the same rate, note 4). Read first-hand 2026-11-26 from
the PDF above, an image-only document rendered and read visually; first found and transcribed
by session:cash-carry on 2026-10-16 (#452).

The schedule is TIERED BY MONTHLY CUMULATIVE VALUE per account type, resetting on the 1st:
    up to 1,000,000 THB/month 0.0499 % · 1M-20M 0.0449 % · 20M-100M 0.0399 %
    100M-200M 0.0349 % · 200M-300M 0.0299 % · above 300M 0.0000 %
A trade that crosses a tier intraday is billed at the old rate and re-rated at end of day
(note 5). A consumer must NEVER assume a tier discount: the basis is the first tier.
NO MINIMUM per order or per day: the announcement states none, and Liberator's pricing page
says "ไม่มีขั้นต่ำ" (https://www.liberator.co.th/article/view/bundai-pricing-liberator, as
quoted in #452; not re-fetched here).

CORROBORATED BY TWO BROKER-SIDE RECORDS, both BUYs, at two notionals:
  * BILLED: a Liberator daily trade confirmation the operator supplied (relayed by
    session:strategy-research 2026-11-26; trade date and account NOT visible in the crop):
