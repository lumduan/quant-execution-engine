Rendered with headless Chrome: the page is a Nuxt app and the served HTML carries NO spec
text at all — a plain curl returns HTTP 200 and 144 KB containing none of these values.
⛔ NOT taken from the SP bridge's /instrument-info: that is the apigwcld / proto-REST plane,
