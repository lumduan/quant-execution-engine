🔑 WHY THIS WRONG READING SURVIVED, WHICH IS THE PART THAT GENERALISES: the first fill ever observed
was BGRIMZ26, matched 1 OF 1. On a FULL fill `price x entered qty` and `price x MATCHED qty`
COINCIDE -- so the evidence that appeared to establish the rule could not distinguish the two
readings, and had no counterexample until the unmatched rows arrived. A generalisation drawn from a
single full fill was never tested by the observation supporting it. Before generalising a field's
formula, ask which OTHER formula the same observation would equally satisfy.

🔑 CONSEQUENCE, AND IT IS THE REASON THIS IS RECORDED IN A *FEE* FILE: a `fee` of 0 is evidence of
NO FILL — never of a zero-fee venue. It must not be banked as a charge of zero. `observations/
