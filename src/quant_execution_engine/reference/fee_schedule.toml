# ════════════════════════════════════════════════════════════════════════════
# THE canonical trading fee schedule for this platform. ONE file, no second copy.
#
# 🔴 WHY THIS EXISTS. On 2026-09-04 an audit found FIVE independent cost models in the
# umbrella. Their multipliers and tick sizes were venue-correct; their FEES were not, and
# the operator's real schedule existed only in conversation. The worst divergence:
# `tfex-s50-multi-tf-swing/backtest/costs.py` charges 160 + 1 = 161 THB per S50 side against
# an actual all-in of 21.40 — 7.52x, and 11.43x on the commission alone.
#
# 🔴 EVERY MONETARY VALUE IS A QUOTED STRING and is converted to Decimal at load. This tree
# already carries a documented defect from YAML coercing `1.20` to a float and `no` to a
# boolean; these are money, and a float here is a wrong number nobody sees.
#
# 🔴 THIS FILE IS A POLICY, NOT A RECORD OF FACTS — corrected 2026-09-04.
#
# It was headed "FACTS, NOT DECISIONS" for one day, and that was wrong ON ITS OWN TERMS: the
# commission entry already said the operator "has instructed that the FLAT 14 be used as the
# conservative basis for all calculations", which is a decision. The broker runs promotions,
# so the rate ACTUALLY CHARGED varies day to day; a single number cannot be a fact about it.
#
# What this file is: a **fixed, deliberately conservative basis pinned at the most expensive
# tier**, so every strategy calculation is deterministic and never flatters itself. Strategies
# read this and ONLY this. Cost calculation must never depend on a network call succeeding.
#
# What the broker actually charges lives in `execution.fee_observations` and is compared
# against this file ONE-SIDEDLY (see `EFFECTIVE-DATED ENTRIES` below).
#
# Still true, and still enforced by tests: no cost logic, no slippage, nothing conditioned on
# a strategy or an outcome. Consumers keep their own logic and read the basis from here.
#
# ── EFFECTIVE-DATED ENTRIES ──────────────────────────────────────────────────────────
# Every field is an APPEND-ONLY LIST of entries, each with `effective_from`. Adoption of a
# higher observed rate APPENDS; it NEVER overwrites. Overwriting would silently make results
# computed before and after incomparable — and this project has just spent a week on a study
# whose conclusion rested on a cost basis nobody could reconstruct. Consumers resolve the
# entry in force for the PERIOD THEY ARE COMPUTING OVER, not the newest one.
#
# ⚠️ DO NOT hand-edit the umbrella's docs/reference/fee-schedule.md. It is GENERATED from
# this file, and a drift test fails if the two disagree. Two hand-maintained copies of the
# same facts is the exact defect this file exists to end.
#     regenerate:  uv run python scripts/generate_fee_doc.py
# ════════════════════════════════════════════════════════════════════════════

schema_version = 1

[meta]
canonical_path = "src/quant_execution_engine/reference/fee_schedule.toml"
generated_doc  = "docs/reference/fee-schedule.md"   # in the UMBRELLA repo
currency       = "THB"

