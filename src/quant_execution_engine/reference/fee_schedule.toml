↻ SHARPENED 2026-09-10 — `amount` IS THE MATCHED VALUE, NOT THE ORDERED ONE.
The ORDER-plane bullet above said "price x qty", which reads as the quantity as ENTERED. It is the
MATCHED quantity. On an UNMATCHED row `amount` is 0 even though a real `price` is present. Observed
