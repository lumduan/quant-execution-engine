  value        = "14"
  effective_from = "2026-09-04"   # the day this basis was first recorded
  unit         = "THB per contract per side"
  source_kind  = "operator_supplied"
  source       = "operator, verbal — recorded into this file 2026-09-04"
  corroborated = false
  note = """
🔴 OPERATOR-SUPPLIED, with NO in-tree corroboration and no published source this session
could reach. Volume tiers exist down to 8 THB; the operator has instructed that the FLAT 14
be used as the conservative basis for all calculations, so a tier discount must never be
assumed here.
⚠️ Do not let this read as venue-fetched. The SSF coefficients in cash-and-carry were once
described as "seeds" when they were broker facts, and the mis-description survived because
nothing stated the provenance. This line is that statement."""
  recorded_utc = "2026-09-04T08:37:26Z"
  max_age_days = 180

  [[instrument.s50_futures.exchange_clearing]]
  value        = "6"
  effective_from = "2026-09-04"   # the day this basis was first recorded
  unit         = "THB per contract per side"
  source_kind  = "operator_supplied"
  source       = "operator, verbal — recorded into this file 2026-09-04"
  corroborated = false
  note = """
COMBINED exchange + clearing, operator-supplied.
⚠️ The venue publishes a CAP on the EXCHANGE COMPONENT ALONE — "Maximum of THB 7 per
contract per side" (futures). 6 sits under that cap, but the two are DIFFERENT QUANTITIES:
a cap on one component versus a combined actual charge. Treating the venue line as
corroboration of this figure would be a category error, so it is recorded as context, not
as a source. See `venue_exchange_fee_cap` below, which IS venue-fetched."""
  recorded_utc = "2026-09-04T08:37:26Z"
  max_age_days = 180

  [[instrument.s50_futures.vat_rate]]
  value        = "0.07"
  effective_from = "2026-09-04"   # the day this basis was first recorded
  unit         = "fraction, applied to (commission + exchange_clearing)"
  source_kind  = "operator_supplied"
  source       = "operator, verbal — recorded into this file 2026-09-04"
  corroborated = false
  note         = "Thai VAT, 7%. Applied to the SUM of the two fee components, not to each."
  recorded_utc = "2026-09-04T08:37:26Z"
  max_age_days = 180

  [[instrument.s50_futures.all_in_per_side]]
  value        = "21.40"
  effective_from = "2026-09-04"   # the day this basis was first recorded
  unit         = "THB per contract per side"
  source_kind  = "derived"
  source       = "(commission + exchange_clearing) * (1 + vat_rate)"
  corroborated = true
  note = """
DERIVED, and a test pins the arithmetic in Decimal: (14 + 6) * 1.07 == 21.40 exactly.
If any component is edited without this figure, the test fails — which is the point."""
  recorded_utc = "2026-09-04T08:37:26Z"
  max_age_days = 180

  [[instrument.s50_futures.contract_multiplier]]
