🔴 A DEGENERATE CASE IS THE MOST DANGEROUS EVIDENCE, BECAUSE IT LOOKS LIKE THE CLEANEST. `matched 1
of 1`, qty 1, a single row, a full fill, an exact round number -- each satisfies the most candidate
