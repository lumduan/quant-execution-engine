NOT shown by either: a SELL (the announcement makes no BUY/SELL distinction), or any tier
below the first.

⚠️ The broker "reserves the right to change without prior notice" (the announcement's own
closing line). That is why this entry has a staleness window, and why a billed rate above it
must be compared one-sidedly (see the file header).

Consumers are NOT switched by this entry. Measured against it: csm-set's own
`commission: 0.0015` is about 3.0x the first tier (it overstates, the safe error), and
