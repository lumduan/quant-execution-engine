Superseded derivation: commission 0.049933 % ex-VAT (~0.05 %), regulator 0.006943 % ex-VAT,
all-in 0.060857 % incl VAT.

🔴 Both in-tree models miss it, IN OPPOSITE DIRECTIONS — which is the entire reason this
file's check is one-sided:
  * csm-set `commission: 0.0015` is EXACTLY 3.00x the venue's ex-VAT commission. It
